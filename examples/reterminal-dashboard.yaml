esphome:
  name: reterminal-dashboard
  friendly_name: reTerminal Dashboard
  on_boot:
    priority: -100
    then:
      - delay: 30s
      - script.execute: fetch_all_data

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret reterminal_api_key

ota:
  - platform: esphome
    password: !secret reterminal_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Reterminal-Dashboard"
    password: !secret reterminal_ap_password

captive_portal:

i2c:
  sda: GPIO6
  scl: GPIO5
  scan: true
  id: bus_a

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

http_request:
  id: http_client
  useragent: esphome/reterminal
  timeout: 10s
  verify_ssl: false   # set true if your endpoint has a publicly trusted cert

# ============================================
# SENSOR CONFIGURATION - EDIT THIS SECTION
# ============================================
substitutions:
  api_base_url: "http://192.168.1.50:5001/api/latest-weather"   # your meshtastic-http-interface host
  unit_param: "?unit=f"   # API returns °C by default; request Fahrenheit

  # Sensor 1 (Row 1, Left) — !62a466b5
  sensor1_name: "Roof"
  sensor1_id: "1654941365"
  sensor1_icon: "\U000F0D3E"  # mdi:tree

  # Sensor 2 (Row 1, Right) — !1d39c6a0
  sensor2_name: "Backyard"
  sensor2_id: "490325664"
  sensor2_icon: "\U000F0D3E"  # mdi:tree

  # Sensor 3 (Row 2, Left) — !6713e95b
  sensor3_name: "Garage"
  sensor3_id: "1729358171"
  sensor3_icon: "\U000F012C"  # mdi:garage

  # Sensor 4 (Row 2, Right) — !79e4ae18 (battery-only node; env fields may read 0)
  sensor4_name: "Car"
  sensor4_id: "2045029912"
  sensor4_icon: "\U000F0D3E"  # mdi:tree

  # Sensor 5 (Row 3, Left) — !e69c5d85 (battery-only node; env fields may read 0)
  sensor5_name: "Truck"
  sensor5_id: "3869007237"
  sensor5_icon: "\U000F0D3E"  # mdi:tree

  # Sensor 6 (Row 3, Right) — !b505c07e
  sensor6_name: "BB6"
  sensor6_id: "3037053054"
  sensor6_icon: "\U000F0D3E"  # mdi:tree

globals:
  # Sensor 1
  - id: sensor1_temp
    type: float
    initial_value: '0'
  - id: sensor1_humidity
    type: float
    initial_value: '0'
  - id: sensor1_pressure
    type: float
    initial_value: '0'
  - id: sensor1_iaq
    type: float
    initial_value: '0'
  
  # Sensor 2
  - id: sensor2_temp
    type: float
    initial_value: '0'
  - id: sensor2_humidity
    type: float
    initial_value: '0'
  - id: sensor2_pressure
    type: float
    initial_value: '0'
  - id: sensor2_iaq
    type: float
    initial_value: '0'
  
  # Sensor 3
  - id: sensor3_temp
    type: float
    initial_value: '0'
  - id: sensor3_humidity
    type: float
    initial_value: '0'
  - id: sensor3_pressure
    type: float
    initial_value: '0'
  - id: sensor3_iaq
    type: float
    initial_value: '0'
  
  # Sensor 4
  - id: sensor4_temp
    type: float
    initial_value: '0'
  - id: sensor4_humidity
    type: float
    initial_value: '0'
  - id: sensor4_pressure
    type: float
    initial_value: '0'
  - id: sensor4_iaq
    type: float
    initial_value: '0'
  
  # Sensor 5
  - id: sensor5_temp
    type: float
    initial_value: '0'
  - id: sensor5_humidity
    type: float
    initial_value: '0'
  - id: sensor5_pressure
    type: float
    initial_value: '0'
  - id: sensor5_iaq
    type: float
    initial_value: '0'

  # Sensor 6
  - id: sensor6_temp
    type: float
    initial_value: '0'
  - id: sensor6_humidity
    type: float
    initial_value: '0'
  - id: sensor6_pressure
    type: float
    initial_value: '0'
  - id: sensor6_iaq
    type: float
    initial_value: '0'

  - id: data_loaded
    type: bool
    initial_value: 'false'

  - id: last_update_time
    type: std::string
    initial_value: '""'

interval:
  - interval: 60min
    then:
      - script.execute: fetch_all_data

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: input_pullup
      inverted: true
    name: "Refresh Button"
    on_press:
      then:
        - script.execute: fetch_all_data

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: America/Chicago

script:
  - id: fetch_all_data
    then:
      # Sensor 1
      - http_request.get:
          url: "${api_base_url}/${sensor1_id}${unit_param}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["temperature"].isNull()) id(sensor1_temp) = root["temperature"].as<float>();
                      if (!root["relative_humidity"].isNull()) id(sensor1_humidity) = root["relative_humidity"].as<float>();
                      if (!root["barometric_pressure"].isNull()) id(sensor1_pressure) = root["barometric_pressure"].as<float>();
                      if (!root["iaq"].isNull()) id(sensor1_iaq) = root["iaq"].as<float>();
                      return true;
                    });
                  }
      - delay: 2s
      
      # Sensor 2
      - http_request.get:
          url: "${api_base_url}/${sensor2_id}${unit_param}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["temperature"].isNull()) id(sensor2_temp) = root["temperature"].as<float>();
                      if (!root["relative_humidity"].isNull()) id(sensor2_humidity) = root["relative_humidity"].as<float>();
                      if (!root["barometric_pressure"].isNull()) id(sensor2_pressure) = root["barometric_pressure"].as<float>();
                      if (!root["iaq"].isNull()) id(sensor2_iaq) = root["iaq"].as<float>();
                      return true;
                    });
                  }
      - delay: 2s
      
      # Sensor 3
      - http_request.get:
          url: "${api_base_url}/${sensor3_id}${unit_param}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["temperature"].isNull()) id(sensor3_temp) = root["temperature"].as<float>();
                      if (!root["relative_humidity"].isNull()) id(sensor3_humidity) = root["relative_humidity"].as<float>();
                      if (!root["barometric_pressure"].isNull()) id(sensor3_pressure) = root["barometric_pressure"].as<float>();
                      if (!root["iaq"].isNull()) id(sensor3_iaq) = root["iaq"].as<float>();
                      return true;
                    });
                  }
      - delay: 2s
      
      # Sensor 4
      - http_request.get:
          url: "${api_base_url}/${sensor4_id}${unit_param}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["temperature"].isNull()) id(sensor4_temp) = root["temperature"].as<float>();
                      if (!root["relative_humidity"].isNull()) id(sensor4_humidity) = root["relative_humidity"].as<float>();
                      if (!root["barometric_pressure"].isNull()) id(sensor4_pressure) = root["barometric_pressure"].as<float>();
                      if (!root["iaq"].isNull()) id(sensor4_iaq) = root["iaq"].as<float>();
                      return true;
                    });
                  }
      - delay: 2s

      # Sensor 5
      - http_request.get:
          url: "${api_base_url}/${sensor5_id}${unit_param}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["temperature"].isNull()) id(sensor5_temp) = root["temperature"].as<float>();
                      if (!root["relative_humidity"].isNull()) id(sensor5_humidity) = root["relative_humidity"].as<float>();
                      if (!root["barometric_pressure"].isNull()) id(sensor5_pressure) = root["barometric_pressure"].as<float>();
                      if (!root["iaq"].isNull()) id(sensor5_iaq) = root["iaq"].as<float>();
                      return true;
                    });
                  }
      - delay: 2s

      # Sensor 6
      - http_request.get:
          url: "${api_base_url}/${sensor6_id}${unit_param}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      if (!root["temperature"].isNull()) id(sensor6_temp) = root["temperature"].as<float>();
                      if (!root["relative_humidity"].isNull()) id(sensor6_humidity) = root["relative_humidity"].as<float>();
                      if (!root["barometric_pressure"].isNull()) id(sensor6_pressure) = root["barometric_pressure"].as<float>();
                      if (!root["iaq"].isNull()) id(sensor6_iaq) = root["iaq"].as<float>();
                      return true;
                    });
                  }
      - delay: 2s

      - lambda: 'id(data_loaded) = true;'
      - component.update: epaper_display

      - lambda: |-
          auto time = id(homeassistant_time).now();
          if (time.is_valid()) {
            id(last_update_time) = time.strftime("%I:%M %p");
          }
      - lambda: 'id(data_loaded) = true;'

sensor:

  - platform: adc
    pin: GPIO4
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    internal: true
    attenuation: 11db
    filters:
      - multiply: 2.0  # Adjust multiplier based on voltage divider

  - platform: template
    name: "Battery Percentage"
    id: battery_percent
    update_interval: 60s
    internal: true
    lambda: |-
      float voltage = id(battery_voltage).state;
      // Typical LiPo: 4.2V (100%) to 3.0V (0%)
      float percent = (voltage - 3.0) / (4.2 - 3.0) * 100.0;
      if (percent > 100) return 100;
      if (percent < 0) return 0;
      return percent;
    unit_of_measurement: '%'

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 60s
    internal: true
  
  # Device uptime
  - platform: uptime
    name: "Uptime"
    id: device_uptime
    update_interval: 60s
    internal: true

text_sensor:
  # WiFi Info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      internal: true
    ssid:
      name: "Connected SSID"
      id: wifi_ssid
      internal: true


font:
  - file: "gfonts://Inter@700"
    id: title_font
    size: 28
  - file: "gfonts://Inter@700"
    id: location_font
    size: 20  # Reduced from 24 to fit compact header
  - file: "gfonts://Inter@700"
    id: value_font
    size: 28  # Reduced from 36 to fit 3-row layout
  - file: "gfonts://Inter@500"
    id: label_font
    size: 14  # Reduced from 16 for compact status bar
  
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_large
    size: 26  # Reduced from 32 to fit compact header
    glyphs:
      - "\U000F0510"  # mdi:thermometer
      - "\U000F058E"  # mdi:water-percent
      - "\U000F029A"  # mdi:gauge
      - "\U000F059D"  # mdi:air-filter
      - "\U000F012C"  # mdi:garage
      - "\U000F02E3"  # mdi:bed
      - "\U000F0DD3"  # mdi:home-floor-b
      - "\U000F0D3E"  # mdi:tree

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: icons_medium
    size: 20  # Reduced from 24 to fit compact card rows
    glyphs:
      - "\U000F0510"  # mdi:thermometer
      - "\U000F058E"  # mdi:water-percent
      - "\U000F029A"  # mdi:gauge
      - "\U000F059D"  # mdi:air-filter

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      const auto BLACK = Color(0, 0, 0, 0);
      const auto BLUE = Color(0, 0, 255, 0);
      const auto GREEN = Color(0, 255, 0, 0);
      const auto RED = Color(255, 0, 0, 0);
      const auto WHITE = Color(255, 255, 255, 0);
      
      // Icon definitions
      const char* ICON_THERMO = "\U000F0510";
      const char* ICON_HUMIDITY = "\U000F058E";
      const char* ICON_PRESSURE = "\U000F029A";
      const char* ICON_AIR = "\U000F059D";
      
      // -------------------------------------------------------
      // 2x3 grid layout
      // Display: 800 x 480px
      // Title bar: 34px (y=0..33)
      // Status bar: 14px (y=466..479)
      // Usable area: y=35 to y=465  => 430px tall
      // 3 rows of cards: 430 / 3 = ~143px each (with 2px gaps)
      //   Row gaps: 2px between rows
      //   CARD_H = 141px
      // 2 columns: 800px wide, 5px left margin, 5px gap, 5px right margin
      //   X1=5, X2=405, CARD_W=390
      // -------------------------------------------------------
      const int CARD_W = 390;
      const int CARD_H = 141;
      const int X1 = 5;
      const int X2 = 405;
      const int Y1 = 35;
      const int Y2 = 178;  // Y1 + CARD_H + 2
      const int Y3 = 321;  // Y2 + CARD_H + 2
      
      // Helper: draw a compact sensor card
      // Header bar is 28px; two data rows share the remaining ~113px
      auto draw_card = [&](int x, int y, const char* icon, const char* name, 
                          float temp, float humidity, float pressure, float iaq) {
        // Card border
        it.rectangle(x, y, CARD_W, CARD_H, BLACK);
        
        // Header bar (28px tall)
        it.filled_rectangle(x + 1, y + 1, CARD_W - 2, 28, BLACK);
        it.print(x + 6,  y + 4, id(icons_large), WHITE, icon);
        it.print(x + 36, y + 5, id(location_font), WHITE, name);
        
        // Data area: rows start at y+35 and y+90
        int row1 = y + 38;
        int row2 = y + 90;
        int col1 = x + 10;
        int col2 = x + 200;
        
        // Row 1 — Temperature (left) | Humidity (right)
        it.print(col1, row1, id(icons_medium), BLACK, ICON_THERMO);
        it.printf(col1 + 24, row1 - 2, id(value_font), BLACK, "%.1f°F", temp);
        
        it.print(col2, row1, id(icons_medium), BLACK, ICON_HUMIDITY);
        it.printf(col2 + 24, row1 - 2, id(value_font), BLACK, "%.0f%%", humidity);
        
        // Row 2 — Pressure (left) | IAQ (right)
        it.print(col1, row2, id(icons_medium), BLACK, ICON_PRESSURE);
        it.printf(col1 + 24, row2 - 2, id(value_font), BLACK, "%.0f", pressure);
        it.print(col1 + 110, row2 + 10, id(label_font), BLACK, "hPa");
        
        it.print(col2, row2, id(icons_medium), BLACK, ICON_AIR);
        it.printf(col2 + 24, row2 - 2, id(value_font), BLACK, "%.0f", iaq);
        it.print(col2 + 85, row2 + 10, id(label_font), BLACK, "IAQ");
      };
      
      // Title bar
      it.filled_rectangle(0, 0, 800, 34, BLUE);
      it.print(400, 4, id(title_font), WHITE, TextAlign::TOP_CENTER, "Meshtastic Sensor Environment");
      
      // Loading state
      if (!id(data_loaded)) {
        it.rectangle(250, 200, 300, 60, BLACK);
        it.print(400, 220, id(title_font), BLACK, TextAlign::CENTER, "Loading...");
        return;
      }

      // Last update timestamp (top right corner)
      if (!id(last_update_time).empty()) {
        it.printf(790, 4, id(label_font), WHITE, TextAlign::TOP_RIGHT, 
                  "Updated: %s", id(last_update_time).c_str());
      }

      // Status bar
      it.filled_rectangle(0, 466, 800, 14, BLACK);
      it.printf(60, 468, id(label_font), WHITE, "%.0fdBm", id(wifi_signal_strength).state);
      
      if (id(battery_percent).has_state()) {
        float batt = id(battery_percent).state;
        it.printf(5, 468, id(label_font), WHITE, "Batt: %.0f%%", batt);
      }
      
      it.printf(795, 468, id(label_font), WHITE, TextAlign::TOP_RIGHT, "%dh", (int)(id(device_uptime).state / 3600));
      
      // Draw all 6 sensor cards in a 2x3 grid
      draw_card(X1, Y1, "${sensor1_icon}", "${sensor1_name}",
                id(sensor1_temp), id(sensor1_humidity), id(sensor1_pressure), id(sensor1_iaq));
      
      draw_card(X2, Y1, "${sensor2_icon}", "${sensor2_name}",
                id(sensor2_temp), id(sensor2_humidity), id(sensor2_pressure), id(sensor2_iaq));
      
      draw_card(X1, Y2, "${sensor3_icon}", "${sensor3_name}",
                id(sensor3_temp), id(sensor3_humidity), id(sensor3_pressure), id(sensor3_iaq));
      
      draw_card(X2, Y2, "${sensor4_icon}", "${sensor4_name}",
                id(sensor4_temp), id(sensor4_humidity), id(sensor4_pressure), id(sensor4_iaq));
      
      draw_card(X1, Y3, "${sensor5_icon}", "${sensor5_name}",
                id(sensor5_temp), id(sensor5_humidity), id(sensor5_pressure), id(sensor5_iaq));
      
      draw_card(X2, Y3, "${sensor6_icon}", "${sensor6_name}",
                id(sensor6_temp), id(sensor6_humidity), id(sensor6_pressure), id(sensor6_iaq));